#cloud-config

stages:
  rootfs:
  - name: "user_custom_mount"
    environment_file: "/run/cos/custom-layout.env"
    environment:
       # Space-separated list of paths bind-mounted onto the persistent
       # partition so they survive OCI upgrades (which replace the rootfs):
       #   /var/lib/docker  - docker images/containers/volumes
       #   /etc/netplan     - saved network config (NetworkManager is netplan-
       #                      managed on Ubuntu; nmcli/nmtui write the credential
       #                      to /etc/netplan/*.yaml)
       CUSTOM_BIND_MOUNTS: "/var/lib/docker /etc/netplan"
