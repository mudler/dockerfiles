name: "NTP one-shot clock step"
# Why this exists: on a box whose primary link is WiFi, systemd-timesyncd never
# syncs. NetworkManager owns the wireless device, which makes it *unmanaged* by
# systemd-networkd, so timesyncd's online-detection never succeeds and it sends
# zero NTP packets -- `timedatectl timesync-status` reports "Server: n/a" and
# "Packet count: 0" while NTP itself is perfectly reachable. The clock then keeps
# whatever the RTC held (or a stale baked epoch), and every TLS handshake fails
# with "certificate has expired or is not yet valid".
#
# That is not cosmetic: it stops the box pulling ANY container image. Observed on
# a Strix Halo box installed from this image on 2026-08-28 -- k3s could not even
# pull rancher/mirrored-pause, so no pod could start, and `flux bootstrap` would
# have failed the same way.
#
# This installs a one-shot service that steps the clock via raw SNTP once the
# network is actually online, bypassing timesyncd's networkd dependency. It
# retries (right at network-online DNS/routing may not be ready yet) and bounds
# every blocking call + the unit's start timeout, so it can never hang the boot.
# Best-effort: never fails boot.
#
# Shared with kairos-thor-docker/time-sync.yaml, which hit the same failure for a
# second reason on top: the Thor devkit has no battery-backed RTC at all.
stages:
  boot:
    - name: "Install NTP one-shot time-step service"
      files:
        - path: /usr/local/bin/kairos-ntp-step
          permissions: 0755
          owner: 0
          group: 0
          content: |
            #!/bin/bash
            # Step the system clock from an NTP server (raw SNTP; python3 is
            # already present). Retries so early-boot network-not-ready-yet does
            # not leave the clock stale; every lookup/query is time-bounded.
            set -u
            for attempt in $(seq 1 20); do
              for host in pool.ntp.org time.cloudflare.com time.google.com; do
                ip=$(timeout 5 getent ahostsv4 "$host" 2>/dev/null | awk '{print $1; exit}')
                [ -z "$ip" ] && continue
                t=$(python3 -c 'import socket,struct,sys; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(5); s.sendto(b"\x1b"+47*b"\x00",(sys.argv[1],123)); d,_=s.recvfrom(48); print(struct.unpack("!12I",d)[10]-2208988800)' "$ip" 2>/dev/null)
                [ -n "${t:-}" ] && { date -u -s "@$t" >/dev/null && { echo "kairos-ntp-step: clock set from $host (attempt $attempt)"; exit 0; }; }
              done
              sleep 3
            done
            echo "kairos-ntp-step: no NTP server reachable after retries" >&2
            exit 0
        - path: /etc/systemd/system/kairos-ntp-step.service
          permissions: 0644
          owner: 0
          group: 0
          content: |
            [Unit]
            Description=One-shot NTP clock step (no persistent RTC; timesyncd can't poll on NM-managed link)
            After=network-online.target NetworkManager-wait-online.service
            Wants=network-online.target
            [Service]
            Type=oneshot
            TimeoutStartSec=120
            ExecStart=/usr/local/bin/kairos-ntp-step
            [Install]
            WantedBy=multi-user.target
      systemctl:
        enable:
          - kairos-ntp-step.service
