#cloud-config

stages:
  rootfs:
  - name: "user_custom_mount"
    environment_file: "/run/cos/custom-layout.env"
    environment:
       # Space-separated list of paths bind-mounted onto the persistent
       # partition so they survive OCI upgrades (which replace the rootfs and
       # reset the ephemeral /etc overlay):
       #   /var/lib/docker  - docker images/containers/volumes
       #   /etc/netplan     - saved network config. On this image NetworkManager
       #                      is netplan-managed: nmcli/nmtui write the WiFi
       #                      credential to /etc/netplan/*.yaml (NOT to
       #                      /etc/NetworkManager/system-connections, which is
       #                      /run-generated), and netplan regenerates the NM
       #                      connection from it at boot. So /etc/netplan is the
       #                      source of truth to persist.
       CUSTOM_BIND_MOUNTS: "/var/lib/docker /etc/netplan"
